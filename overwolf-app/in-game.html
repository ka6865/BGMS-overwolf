<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>BGMS Companion Overlay</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body class="overlay-shell">
    <main class="overlay-card" aria-label="BGMS Companion live overlay" data-i18n-aria-label="overlayAriaLabel">
      <section class="mini-hud" aria-label="Live match metrics">
        <span class="mini-brand" data-i18n="overlayEyebrow">BGMS Companion</span>
        <span class="mini-phase" id="phase" data-i18n="idle">Idle</span>
        <span class="mini-item"><span data-i18n="kills">Kills</span> <strong id="kills">0</strong></span>
        <span class="mini-item" id="health-item"><span data-i18n="health">Health</span> <strong id="health">--</strong></span>
        <span class="mini-flag is-hidden" id="knocked-flag" data-i18n="knockedLabel">KO</span>
        <span class="mini-item" id="alive-item"><span data-i18n="alive">Alive</span> <strong id="alive">--</strong></span>
      </section>

      <section class="mini-status" aria-label="Match state">
        <span id="match-state" data-i18n="waitingForPubg">Waiting for PUBG</span>
        <span id="last-event" data-i18n="noLiveEvents">No live events yet</span>
        <span id="handoff-indicator" class="mini-note is-hidden" role="status"></span>
        <span id="service-warning" class="mini-warning is-hidden" role="status"></span>
      </section>

      <section class="debug-panel is-hidden" aria-label="Debug state">
        <span id="debug-gep">GEP idle</span>
        <span id="debug-game">Game --</span>
        <span id="debug-last">Last --</span>
        <span id="debug-raw">Raw --</span>
        <span id="debug-recent">Recent --</span>
        <span id="debug-service">Service --</span>
        <span id="debug-error">Error --</span>
      </section>
      <span id="weapon-state" class="visually-hidden" data-i18n="weaponUnknown">Weapon state unknown</span>
    </main>

    <script src="i18n.js"></script>
    <script src="in-game.js"></script>
  </body>
</html>
